; LoRa file transfer - one environment per board type and node role.
; "a" and "b" only differ in the node address (build flag -DNODE_A).
; Use: python lora.py flash --board r4 --node a

[platformio]
default_envs = uno_r4_wifi_a

[env]
framework = arduino
monitor_speed = 115200
lib_deps =
    sandeepmistry/LoRa@^0.8.0

[base_r4]
platform = renesas-ra
board = uno_r4_wifi

[base_r3]
platform = atmelavr
board = uno

[env:uno_r4_wifi_a]
extends = base_r4
build_flags = -DNODE_A

[env:uno_r4_wifi_b]
extends = base_r4

[env:uno_a]
extends = base_r3
build_flags = -DNODE_A

[env:uno_b]
extends = base_r3
